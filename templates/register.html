{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-16 px-4 sm:px-6 lg:px-8">
    <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-4">Create a new user</h1>
        <p class="text-gray-500 mb-6">Register a guest account and start browsing rooms and boat features.</p>
        {% if message %}
        <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-red-700">{{ message }}</div>
        {% endif %}
        <form method="POST" action="/register" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input name="username" type="text" required class="mt-2 w-full rounded-2xl border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input name="password" type="password" required class="mt-2 w-full rounded-2xl border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white rounded-2xl py-3 text-sm font-semibold hover:bg-blue-700 transition">Create Account</button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            Already have an account? <a href="/login" class="text-blue-600 hover:underline">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
